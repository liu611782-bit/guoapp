name: Build Android APK (test)

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "选择应用版本"
        required: true
        type: choice
        options:
          - hongguojian
          - zhenguojian
        default: hongguojian

permissions:
  contents: read

concurrency:
  group: android-apk-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.1"
          cache: true
          cache-dependency-path: native/go.sum

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"

      - name: Verify build tools
        run: |
          java -version
          go version
          flutter --version
          python --version
          sdkmanager --list_installed

      - name: Build APK
        env:
          EDITION: ${{ inputs.edition }}
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
        run: |
          set -euo pipefail
          if [ "$EDITION" = "zhenguojian" ]; then
            python scripts/build_android.py --all-sources --abi arm64-v8a
          else
            python scripts/build_android.py --abi arm64-v8a
          fi

      - name: Verify APK exists
        run: |
          set -euo pipefail
          find dist/android -maxdepth 1 -type f -name "*.apk" -print
          test "$(find dist/android -maxdepth 1 -type f -name "*.apk" | wc -l)" -ge 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guodong-android-${{ inputs.edition }}-arm64
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 14
